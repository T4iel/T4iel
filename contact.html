<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | T4iel Lab</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <!-- Shared Navigation Bar Placeholder -->
    <div id="navbar-placeholder"></div>

    <main class="container py-5">
        <h2 class="text-maroon fw-bold mb-4">Contact Us</h2>
        <p class="lead text-secondary mb-5">If you have any questions, want to join our lab as a student, or want to
            collaborate, please send us a message below.</p>

        <div class="row g-5">
            <!-- Office Address Coordinates -->
            <div class="col-lg-5">
                <div class="card border-0 shadow-sm p-4 h-100 bg-white">
                    <h3 class="h5 fw-bold text-maroon mb-4">T4IEL Lab</h3>

                    <div class="mb-4">
                        <span class="d-block text-uppercase small text-muted fw-bold mb-1">Lab Email</span>
                        <a href="mailto:t4iel.lab@ahduni.edu.in"
                            class="text-dark fw-semibold text-decoration-none hover-maroon">t4iel.lab@gmail.com</a>
                    </div>

                    <div class="mb-4">
                        <span class="d-block text-uppercase small text-muted fw-bold mb-1">Location</span>
                        <span class="text-dark fw-medium">Ahmedabad University</span>
                    </div>

                    <div>
                        <span class="d-block text-uppercase small text-muted fw-bold mb-1">Mailing Address</span>
                        <span class="text-secondary small">Commerce Six Roads, Navrangpura, Ahmedabad, Gujarat 380009,
                            India</span>
                    </div>
                </div>
            </div>

            <!-- Friendly Message Form -->
            <div class="col-lg-7">
                <div class="card border-0 shadow-sm p-4 bg-white">
                    <h3 class="h5 fw-bold text-maroon mb-4">Send a Message</h3>

                    <form
                        onsubmit="event.preventDefault(); alert('Message sent successfully. Thank you for contacting T4iel Lab!');"
                        class="row g-3">
                        <div class="col-md-6">
                            <label for="contact-name" class="form-label small fw-bold text-secondary">Full Name</label>
                            <input type="text" id="contact-name" class="form-control" placeholder="Your Name" required>
                        </div>

                        <div class="col-md-6">
                            <label for="contact-email" class="form-label small fw-bold text-secondary">Email
                                Address</label>
                            <input type="email" id="contact-email" class="form-control" placeholder="Your Email Address"
                                required>
                        </div>

                        <div class="col-12">
                            <label for="contact-affiliation" class="form-label small fw-bold text-secondary">School or
                                Organization</label>
                            <input type="text" id="contact-affiliation" class="form-control"
                                placeholder="Your School or Organization" required>
                        </div>

                        <div class="col-12">
                            <label for="contact-subject" class="form-label small fw-bold text-secondary">Topic</label>
                            <select id="contact-subject" class="form-select">
                                <option>Request for Software or Data</option>
                                <option>Research Collaboration</option>
                                <option>Prospective Student (Undergraduate/Graduate)</option>
                                <option>General Enquiry</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="contact-message" class="form-label small fw-bold text-secondary">Message</label>
                            <textarea id="contact-message" class="form-control" rows="4"
                                placeholder="Write your message here..." required></textarea>
                        </div>

                        <div class="col-12">
                            <button type="submit" class="btn btn-maroon px-4 py-2 mt-2">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Shared Footer Placeholder -->
    <div id="footer-placeholder"></div>
</body>

</html>
